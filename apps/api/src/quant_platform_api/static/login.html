<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>量化研究平台 · 登录</title>
    <link rel="stylesheet" href="/assets/theme.css" />
  </head>
  <body>
    <div class="auth-shell">
      <section class="auth-card auth-card-single">
        <section class="auth-panel">
          <div class="identity-chip">Quant Platform</div>
          <p class="eyebrow" style="margin-top: 18px">Sign In</p>
          <h1 class="auth-title">登录后进入你的量化研究工作台</h1>
          <p class="auth-subtitle">
            登录后可访问用户工作台、策略工坊、指标设置、规则模块、回测中心和交易复盘。
          </p>
          <div id="status-banner" class="status-banner">请输入用户名和密码。</div>
          <form id="login-form" class="form-grid" style="margin-top: 18px">
            <label class="field">
              <span>用户名</span>
              <input id="username" autocomplete="username" placeholder="请输入用户名" />
            </label>
            <label class="field">
              <span>密码</span>
              <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" />
            </label>
            <div class="actions">
              <button type="submit">登录并进入</button>
              <a class="btn secondary" href="/register">去注册</a>
              <a class="btn ghost" href="/">返回首页</a>
            </div>
          </form>
        </section>
      </section>
    </div>

    <script type="module" src="/assets/login.js"></script>
  </body>
</html>
