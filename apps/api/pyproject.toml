[project]
name = "quant-platform-api"
version = "0.1.0"
description = "Phase 1 backend foundation for the AI quant research platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.49,<2.0.0",
    "fastapi>=0.135.2,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pillow>=12.2.0,<13.0.0",
    "pandas>=3.0.1,<4.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "psycopg[binary]>=3.3.3,<4.0.0",
    "rapidocr_onnxruntime>=1.4.4,<2.0.0",
    "sqlalchemy>=2.0.48,<3.0.0",
    "tushare>=1.4.29,<2.0.0",
    "uvicorn>=0.42.0,<1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
